# ccu-diag.service drop-in: 平台 SOME/IP 运行时接入
# (CCU-DIAG-DSN-CR-002 §1.1 / CR-007；baseline unit 由 CR-009 §6.1 提供)
#
# 为什么必须有这三项：
# 1. VSOMEIP_CONFIGURATION：未设置时 vsomeip 只查 ./vsomeip.json 与
#    /etc/vsomeip/vsomeip.json，都找不到就把自己当 routing manager（默认域
#    "vsomeip"），于是看不到 tbox-someip 提供的路由；CCU-FOTA 侧因此长期报
#    "DIAG service unavailable, someip_service_id=0x1110"。
# 2. VSOMEIP_APPLICATION_NAME：必须与 /etc/ccu/someip/vsomeip.json 的
#    applications 登记名一致（ccu-diag = 0x1110）。运行时代码
#    （src/someip_process_application.cpp）在配置缺省时也回落到同名，
#    二者必须成对维护。
# 3. PrivateTmp=no：baseline ccu-diag.service（CR-009 §6.1）设置
#    PrivateTmp=yes 作为默认硬化；但 vsomeip 经 /tmp 下的 unix socket 连接
#    routing manager（本机 /tmp/-0），PrivateTmp=yes 会把 /tmp 私有化并隔离
#    该 socket。本 drop-in 作为平台运行资产覆盖该默认值，与
#    tbox-someip.service 的处理方式保持一致。
#
# 说明：本文件属于平台运行资产，不由 ccu-diag-runtime install component 交付；
# 由 CCU-BUILD Platform Manifest / 设备投放固化到
# /etc/systemd/system/ccu-diag.service.d/。
[Service]
Environment=VSOMEIP_CONFIGURATION=/etc/ccu/someip/vsomeip.json
Environment=VSOMEIP_APPLICATION_NAME=ccu-diag
PrivateTmp=no
